<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إضافة حلقة جديدة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 2rem; display: flex; justify-content: center; }
        .form-card { background: #1e293b; padding: 2rem; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid #334155; }
        h2 { margin-bottom: 1.5rem; color: #38bdf8; text-align: center; }
        .input-group { margin-bottom: 1.25rem; }
        label { display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: #cbd5e1; }
        input { width: 100%; padding: 0.75rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { width: 100%; padding: 0.75rem; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .status { margin-top: 1rem; text-align: center; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="form-card">
        <h2>إضافة حلقة / مسلسل جديد</h2>
        <form id="addEpisodeForm">
            <div class="input-group">
                <label>اسم المسلسل:</label>
                <input type="text" id="seriesName" placeholder="مثال: مسلسلات رمضان" required>
            </div>
            <div class="input-group">
                <label>عنوان الحلقة:</label>
                <input type="text" id="epTitle" placeholder="مثال: الحلقة 1" required>
            </div>
            <div class="input-group">
    <label>رابط الفيديو الأساسي (MP4):</label>
    <input type="url" id="videoUrl" placeholder="رابط الفيديو الأساسي" required>
</div>

<div class="input-group">
    <label>رابط جودة 240p:</label>
    <input type="url" id="video240p" placeholder="رابط فيديو 240p">
</div>

<div class="input-group">
    <label>رابط جودة 360p:</label>
    <input type="url" id="video360p" placeholder="رابط فيديو 360p">
</div>

<div class="input-group">
    <label>رابط جودة 480p:</label>
    <input type="url" id="video480p" placeholder="رابط فيديو 480p">
</div>
            
    <div class="input-group">
    <label>رابط جودة 720p:</label>
    <input type="url" id="video720p" placeholder="رابط فيديو 720p">
</div>
            <div class="input-group">
                <label>رابط الصورة المصغرة (Thumbnail):</label>
                <input type="url" id="thumbUrl" placeholder="https://domain.com/image.jpg">
            </div>
            <button type="submit" id="submitBtn">حفظ ونشر الحلقة</button>
        </form>
        <div id="statusMessage" class="status"></div>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('addEpisodeForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            status.style.color = '#38bdf8';
            status.textContent = 'جاري الحفظ...';

          const series_name = document.getElementById('seriesName').value;
  const title = document.getElementById('epTitle').value;
  const video_url = document.getElementById('videoUrl').value;

  const video_240p = document.getElementById('video240p').value;
  const video_360p = document.getElementById('video360p').value;
  const video_480p = document.getElementById('video480p').value;
  const video_720p = document.getElementById('video720p').value;

  const thumbnail_url = document.getElementById('thumbUrl').value;

try {
    const { data, error } = await supabaseClient
        .from('episodes')
        .insert([{
            series_name,
            title,
            video_url,
            video_240p,
            video_360p,
            video_480p,
            video_720p,
            thumbnail_url
        }]);

                if (error) throw error;

                status.style.color = '#22c55e';
                status.textContent = 'تم إدراج الحلقة بنجاح!';
                document.getElementById('addEpisodeForm').reset();
            } catch (error) {
                console.error('Supabase error:', error);
                status.style.color = '#ef4444';
                status.textContent = 'حدث خطأ أثناء الحفظ: ' + (error.message || error);
            } finally {
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
