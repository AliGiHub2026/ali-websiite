<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المسلسلات القصيرة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.5rem; color: #38bdf8; }
        
        .main-container { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
        
        .player-section { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
        .plyr { --plyr-color-main: #38bdf8; border-radius: 8px; }
        .video-title { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; color: #f1f5f9; }
        
        .playlist-section { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; max-height: 600px; overflow-y: auto; }
        .playlist-section h3 { margin-bottom: 1rem; color: #94a3b8; font-size: 1rem; }
        
        .episode-card { display: flex; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 0.5rem; background: #0f172a; }
        .episode-card:hover, .episode-card.active { background: #334155; }
        .episode-card img { width: 100px; height: 60px; object-fit: cover; border-radius: 4px; }
        .episode-info { display: flex; flex-direction: column; justify-content: center; }
        .episode-title { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; }
        .series-name { font-size: 0.75rem; color: #38bdf8; margin-top: 0.25rem; }
    </style>
</head>
<body>

    <header>
        <h1>دراما قصيرة</h1>
        <a href="admin.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">لوحة التحكم</a>
    </header>

    <div class="main-container">
        <div class="player-section">
<div id="playerHolder" dir="ltr"></div>
            <div class="video-title" id="currentVideoTitle">اختر حلقة للمشاهدة</div>
        </div>

        <div class="playlist-section">
            <h3>قائمة الحلقات والمسلسلات</h3>
            <div id="playlistContainer">
                <p style="color: #64748b; text-align: center;">جاري تحميل المحتوى...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        async function loadEpisodes() {
            const container = document.getElementById('playlistContainer');
            
            const { data: episodes, error } = await supabaseClient
                .from('episodes')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !episodes || episodes.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">لا توجد حلقات معروضة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            episodes.forEach((ep, index) => {
                const card = document.createElement('div');
                card.className = `episode-card ${index === 0 ? 'active' : ''}`;
                card.innerHTML = `
                    <img src="${ep.thumbnail_url || 'https://via.placeholder.com/100x60'}" alt="${esc(ep.title)}">
                    <div class="episode-info">
                        <div class="episode-title">${esc(ep.title)}</div>
                        <div class="series-name">${esc(ep.series_name)}</div>
                    </div>
                `;
                card.onclick = () => playVideo(ep, card);
                container.appendChild(card);
            });

            if(episodes.length > 0) {
                playVideo(episodes[0], container.children[0]);
            }
        }

let hls = null, plyr = null;

function esc(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
}

function playVideo(ep, cardElement) {
    document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
    if (cardElement) cardElement.classList.add('active');
    document.getElementById('currentVideoTitle').textContent = ep.title;

    // تنظيف المشغّل السابق وإنشاء عنصر فيديو جديد
    if (hls) { hls.destroy(); hls = null; }
    if (plyr) { try { plyr.destroy(); } catch (e) {} plyr = null; }
    const holder = document.getElementById('playerHolder');
    holder.innerHTML = '<video id="mainPlayer" controls playsinline></video>';
    const video = document.getElementById('mainPlayer');
    if (ep.thumbnail_url) video.poster = ep.thumbnail_url;

    const opts = {
        settings: ['quality', 'speed'],
        ratio: '16:9',
        i18n: { quality: 'الجودة', speed: 'السرعة', normal: 'عادي', qualityLabel: { 0: 'تلقائي' } }
    };
    const url = ep.video_url || '';
    const start = () => video.play().catch(() => {});

    if (/\.m3u8(\?|$)/i.test(url)) {
        if (window.Hls && Hls.isSupported()) {
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                const heights = [...new Set(hls.levels.map(l => l.height))].sort((a, b) => b - a);
                plyr = new Plyr(video, {
                    ...opts,
                    quality: {
                        default: 0,
                        options: [0, ...heights],
                        forced: true,
                        onChange: (h) => {
                            if (h === 0) { hls.currentLevel = -1; return; }
                            hls.levels.forEach((l, i) => { if (l.height === h) hls.currentLevel = i; });
                        }
                    }
                });
                start();
            });
        } else {
            // آيفون/سفاري: HLS مدعوم أصلاً (الجودة تلقائية)
            video.src = url;
            plyr = new Plyr(video, { ...opts, settings: ['speed'] });
            start();
        }
        return;
    }

    // حلقات قديمة: ملفات MP4 منفصلة لكل جودة (تظهر أيضاً داخل ⚙️)
    const sources = [
        { src: ep.video_url, size: 1080 }, { src: ep.video_720p, size: 720 },
        { src: ep.video_480p, size: 480 }, { src: ep.video_360p, size: 360 },
        { src: ep.video_240p, size: 240 }
    ].filter(x => x.src).map(x => ({ ...x, type: 'video/mp4' }));
    plyr = new Plyr(video, { ...opts, quality: { default: sources.length > 1 ? 720 : 1080, options: [1080, 720, 480, 360, 240] } });
    if (sources.length > 1) plyr.source = { type: 'video', sources };
    else video.src = url;
    start();
}

        window.onload = loadEpisodes;
    </script>
</body>
</html>
