<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دراما قصيرة</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<style>
:root{--bg:#141414;--surface:#1f1f1f;--surface2:#2a2a2a;--text:#fff;--muted:#b3b3b3;--red:#e50914;--red-d:#b20710}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.9rem 4%;background:linear-gradient(#000c,#0000);backdrop-filter:blur(6px)}
.logo{color:var(--red);font-weight:800;font-size:1.7rem;letter-spacing:-.5px;white-space:nowrap}
.search{flex:1;max-width:340px}
.search input{width:100%;padding:.55rem 1rem;border-radius:4px;border:1px solid #555;background:#000a;color:#fff;font:inherit;font-size:.95rem}
.search input:focus{outline:2px solid #fff}
main{padding-bottom:3rem}
.msg{color:var(--muted);text-align:center;padding:4rem 1rem}

/* الواجهة 1 */
.hero{position:relative;min-height:52vh;display:flex;align-items:flex-end;padding:0 4% 3rem;margin-top:-64px;background:#000 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 4%,#14141400 60%),linear-gradient(to left,#000000b3,#0000 70%)}
.hero>div{position:relative;max-width:560px}
.hero h2{font-size:clamp(1.8rem,4vw,3rem);font-weight:800;line-height:1.3;margin-bottom:.5rem}
.hero p{color:#e5e5e5;margin-bottom:1.2rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.6rem;border-radius:4px;font:700 1rem 'Cairo',sans-serif;border:0;cursor:pointer}
.btn-w{background:#fff;color:#000}.btn-w:hover{background:#ffffffc0}
.btn-r{background:var(--red);color:#fff}.btn-r:hover{background:var(--red-d)}
.row-title{font-size:1.3rem;font-weight:700;margin:1.6rem 4% .9rem}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:0 4% .4rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.3rem 1.1rem;border-radius:99px;border:1px solid #555;background:none;color:#ddd;font:600 .9rem 'Cairo',sans-serif;cursor:pointer}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:.9rem;padding:0 4%}
.card{display:block;border-radius:6px;overflow:hidden;background:var(--surface);transition:transform .2s}
.card:hover,.card:focus-visible{transform:scale(1.05);outline:2px solid #fff;z-index:2;position:relative}
.poster{aspect-ratio:2/3;background:linear-gradient(160deg,#3a0a0d,#141414);display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:800;color:var(--red)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.card .t{padding:.6rem .7rem .8rem}
.card .t b{display:block;font-size:.95rem;line-height:1.4}
.card .t span{color:var(--muted);font-size:.8rem}

/* الواجهة 2 */
.banner{position:relative;margin-top:-64px;padding:7rem 4% 2rem;background:#000 center/cover no-repeat}
.banner::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg),#14141499),linear-gradient(to left,#000000cc,#0000)}
.banner>div{position:relative;max-width:720px}
.back{display:inline-block;color:var(--muted);margin-bottom:1rem;font-weight:600}
.back:hover{color:#fff}
.banner h1{font-size:clamp(1.6rem,3.5vw,2.6rem);font-weight:800;line-height:1.35;margin-bottom:.6rem}
.meta{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:.9rem}
.meta span{background:#ffffff1f;padding:.15rem .8rem;border-radius:4px;font-size:.85rem}
.meta .gn{background:var(--red)}
.desc{color:#e5e5e5;line-height:1.9;margin-bottom:1rem;max-width:640px}
.share{display:flex;gap:.6rem;flex-wrap:wrap}
.share a,.share button{padding:.4rem 1rem;border-radius:4px;background:#ffffff1f;color:#fff;font:600 .85rem 'Cairo',sans-serif;border:0;cursor:pointer}
.share a:hover,.share button:hover{background:#ffffff40}
.watch{display:grid;grid-template-columns:1fr 340px;gap:1.2rem;padding:0 4%;max-width:1500px;margin:0 auto}
@media(max-width:900px){.watch{grid-template-columns:1fr}}
.player-box{background:var(--surface);border-radius:8px;padding:.8rem}
video{width:100%;aspect-ratio:16/9;background:#000;border-radius:6px}
.plyr{--plyr-color-main:var(--red);border-radius:6px}
.video-title{font-size:1.15rem;font-weight:700;margin:.9rem .2rem .2rem}
.eps{background:var(--surface);border-radius:8px;padding:.8rem;max-height:640px;overflow-y:auto}
.eps h3{font-size:1.05rem;margin:.1rem .2rem .8rem}
.ep{display:flex;gap:.75rem;align-items:center;padding:.6rem;border-radius:6px;cursor:pointer;transition:background .15s;border-inline-start:3px solid transparent}
.ep:hover{background:var(--surface2)}
.ep.active{background:var(--surface2);border-inline-start-color:var(--red)}
.ep .n{color:var(--muted);font-size:1.3rem;font-weight:700;min-width:1.6rem;text-align:center}
.ep .th{width:104px;height:60px;border-radius:4px;object-fit:cover;background:#000;flex:none}
.ep .tt{font-size:.92rem;font-weight:600}
</style>
</head>
<body>
<header>
  <a class="logo" href="#/">دراما قصيرة</a>
  <div class="search"><input id="q" type="search" placeholder="ابحث عن مسلسل..." autocomplete="off"></div>
</header>
<main id="app"><p class="msg">جاري تحميل المحتوى...</p></main>

<script src="config.js"></script>
<script>
const app = document.getElementById('app');
const qInput = document.getElementById('q');
let SERIES = null;                 // [{name,key,episodes,...}]
let hls = null, plyr = null;
let curGenre = '', curQuery = '';

function esc(t){
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const bg = u => u ? `style="background-image:url('${esc(encodeURI(u))}')"` : '';

/* توحيد الكتابة: يتجاهل المسافات الزائدة والهمزات والتشكيل */
function norm(t){
  return String(t || '').replace(/[\u064B-\u065F\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/\s+/g, ' ').trim().toLowerCase();
}

/* ---------- تذكّر آخر حلقة ---------- */
function getProgress(){ try { return JSON.parse(localStorage.getItem('sf_progress') || '{}'); } catch(e){ return {}; } }
function saveProgress(key, i){ try { const p = getProgress(); p[key] = i; localStorage.setItem('sf_progress', JSON.stringify(p)); } catch(e){} }

/* ---------- جلب البيانات وتجميعها ---------- */
async function loadData(){
  if (SERIES) return SERIES;
  const { data, error } = await supabaseClient.from('episodes').select('*').order('created_at', { ascending: true });
  if (error || !data) { SERIES = []; return SERIES; }
  const map = new Map();
  data.forEach(ep => {
    const name = (ep.series_name || 'بدون اسم').trim().replace(/\s+/g, ' ');
    const key = norm(name);
    if (!map.has(key)) map.set(key, { name, key, episodes: [] });
    map.get(key).episodes.push(ep);
  });
  SERIES = [...map.values()].map(s => {
    s.episodes.sort((a, b) => a.title.localeCompare(b.title, 'ar', { numeric: true }));
    s.latest = Math.max(...s.episodes.map(e => +new Date(e.created_at)));
    s.poster = (s.episodes.find(e => e.thumbnail_url) || {}).thumbnail_url || '';
    s.description = (s.episodes.find(e => e.description) || {}).description || '';
    s.genre = (s.episodes.find(e => e.genre) || {}).genre || '';
    return s;
  }).sort((a, b) => b.latest - a.latest);
  return SERIES;
}

function stopPlayer(){
  if (hls) { hls.destroy(); hls = null; }
  if (plyr) { try { plyr.destroy(); } catch(e){} plyr = null; }
}

/* ---------- الواجهة 1: المسلسلات ---------- */
function card(s, idx){
  const href = '#/series/' + encodeURIComponent(s.name) + (idx != null ? '/' + idx : '');
  return `<a class="card" href="${href}">
    <div class="poster">${s.poster ? `<img src="${esc(s.poster)}" alt="" loading="lazy" onerror="this.remove()">` : esc(s.name.charAt(0))}</div>
    <div class="t"><b>${esc(s.name)}</b><span>${s.episodes.length} حلقة${s.genre ? ' • ' + esc(s.genre) : ''}</span></div>
  </a>`;
}

function renderGrid(){
  const q = norm(curQuery);
  const list = SERIES.filter(s => (!curGenre || s.genre === curGenre) && (!q || norm(s.name).includes(q)));
  const el = document.getElementById('grid');
  if (!el) return;
  el.innerHTML = list.length ? list.map(s => card(s)).join('') : '<p class="msg" style="grid-column:1/-1">لا توجد نتائج.</p>';
  document.getElementById('gridTitle').textContent = (curQuery || curGenre) ? 'نتائج البحث' : 'كل المسلسلات';
}

function homePage(){
  stopPlayer();
  document.title = 'دراما قصيرة';
  if (!SERIES.length) { app.innerHTML = '<p class="msg">لا توجد مسلسلات معروضة حالياً.</p>'; return; }
  const f = SERIES[0];
  const prog = getProgress();
  const cont = SERIES.filter(s => prog[s.key] != null && prog[s.key] < s.episodes.length);
  const genres = [...new Set(SERIES.map(s => s.genre).filter(Boolean))];
  app.innerHTML = `
    <section class="hero" ${bg(f.poster)}>
      <div>
        <h2>${esc(f.name)}</h2>
        <p>${f.episodes.length} حلقة${f.genre ? ' • ' + esc(f.genre) : ''}</p>
        <a class="btn btn-w" href="#/series/${encodeURIComponent(f.name)}">▶ شاهد الآن</a>
      </div>
    </section>
    ${cont.length ? `<h2 class="row-title">تابع المشاهدة</h2><div class="grid">${cont.map(s => card(s, prog[s.key])).join('')}</div>` : ''}
    ${genres.length ? `<div class="chips" style="margin-top:1.4rem">
      <button class="chip on" data-g="">الكل</button>${genres.map(g => `<button class="chip" data-g="${esc(g)}">${esc(g)}</button>`).join('')}</div>` : ''}
    <h2 class="row-title" id="gridTitle">كل المسلسلات</h2>
    <div class="grid" id="grid"></div>`;
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    curGenre = b.dataset.g;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
    renderGrid();
  });
  renderGrid();
}

/* ---------- الواجهة 2: صفحة المسلسل ---------- */
function seriesPage(name, idxParam){
  stopPlayer();
  const key = norm(name);
  const s = SERIES.find(x => x.key === key);
  if (!s) { app.innerHTML = '<p class="msg">المسلسل غير موجود.</p><p class="msg"><a class="btn btn-r" href="#/">العودة إلى المسلسلات</a></p>'; return; }
  document.title = s.name + ' - دراما قصيرة';
  const saved = getProgress()[s.key];
  const start = Math.min(Math.max(idxParam != null ? idxParam : (saved || 0), 0), s.episodes.length - 1);
  const pageUrl = location.href.split('#')[0] + '#/series/' + encodeURIComponent(s.name);
  const shareText = encodeURIComponent(s.name + '\n' + pageUrl);
  app.innerHTML = `
    <section class="banner" ${bg(s.poster)}>
      <div>
        <a class="back" href="#/">→ كل المسلسلات</a>
        <h1>${esc(s.name)}</h1>
        <div class="meta">${s.genre ? `<span class="gn">${esc(s.genre)}</span>` : ''}<span>${s.episodes.length} حلقة</span></div>
        ${s.description ? `<p class="desc">${esc(s.description)}</p>` : ''}
        <div class="share">
          <a href="https://wa.me/?text=${shareText}" target="_blank" rel="noopener">مشاركة واتساب</a>
          <a href="https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(s.name)}" target="_blank" rel="noopener">مشاركة تيليجرام</a>
          <button type="button" id="copyBtn">نسخ الرابط</button>
        </div>
      </div>
    </section>
    <section class="watch" style="margin-top:1.2rem">
      <div class="player-box">
        <div id="playerHolder" dir="ltr"></div>
        <div class="video-title" id="currentVideoTitle"></div>
      </div>
      <aside class="eps">
        <h3>الحلقات (${s.episodes.length})</h3>
        <div id="epList">${s.episodes.map((ep, i) => `
          <div class="ep" data-i="${i}">
            <span class="n">${i + 1}</span>
            ${ep.thumbnail_url ? `<img class="th" src="${esc(ep.thumbnail_url)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
            <span class="tt">${esc(ep.title)}</span>
          </div>`).join('')}</div>
      </aside>
    </section>`;

  document.getElementById('copyBtn').onclick = async (e) => {
    try { await navigator.clipboard.writeText(pageUrl); e.target.textContent = 'تم النسخ ✓'; }
    catch(err){ prompt('انسخ الرابط:', pageUrl); }
  };

  const open = (i, autoplay) => {
    document.querySelectorAll('.ep').forEach(c => c.classList.toggle('active', +c.dataset.i === i));
    history.replaceState(null, '', '#/series/' + encodeURIComponent(s.name) + '/' + i);
    playVideo(s.episodes[i], autoplay, {
      onPlay: () => saveProgress(s.key, i),
      onEnd: () => { if (i + 1 < s.episodes.length) { open(i + 1, true); document.querySelector('.ep.active')?.scrollIntoView({ block: 'nearest' }); } }
    });
  };
  document.querySelectorAll('.ep').forEach(c => c.onclick = () => open(+c.dataset.i, true));
  open(start, false);
}

/* ---------- المشغّل ---------- */
function playVideo(ep, autoplay, hooks){
  document.getElementById('currentVideoTitle').textContent = ep.title;
  stopPlayer();
  const holder = document.getElementById('playerHolder');
  holder.innerHTML = '<video id="mainPlayer" controls playsinline></video>';
  const video = document.getElementById('mainPlayer');
  if (ep.thumbnail_url) video.poster = ep.thumbnail_url;
  video.addEventListener('play', () => hooks && hooks.onPlay && hooks.onPlay());
  video.addEventListener('ended', () => hooks && hooks.onEnd && hooks.onEnd());

  const opts = {
    settings: ['quality', 'speed'], ratio: '16:9',
    i18n: { quality: 'الجودة', speed: 'السرعة', normal: 'عادي', qualityLabel: { 0: 'تلقائي' } }
  };
  const url = ep.video_url || '';
  const start = () => { if (autoplay) video.play().catch(() => {}); };

  if (/\.m3u8(\?|$)/i.test(url)) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        const heights = [...new Set(hls.levels.map(l => l.height))].sort((a, b) => b - a);
        plyr = new Plyr(video, { ...opts, quality: {
          default: 0, options: [0, ...heights], forced: true,
          onChange: h => {
            if (h === 0) { hls.currentLevel = -1; return; }
            hls.levels.forEach((l, i) => { if (l.height === h) hls.currentLevel = i; });
          }
        }});
        start();
      });
    } else {
      video.src = url;
      plyr = new Plyr(video, { ...opts, settings: ['speed'] });
      start();
    }
    return;
  }

  const sources = [
    { src: ep.video_url, size: 1080 }, { src: ep.video_720p, size: 720 },
    { src: ep.video_480p, size: 480 }, { src: ep.video_360p, size: 360 },
    { src: ep.video_240p, size: 240 }
  ].filter(x => x.src).map(x => ({ ...x, type: 'video/mp4' }));
  plyr = new Plyr(video, { ...opts, quality: { default: sources.length > 1 ? 720 : 1080, options: [1080, 720, 480, 360, 240] } });
  if (sources.length > 1) plyr.source = { type: 'video', sources };
  else video.src = url;
  start();
}

/* ---------- عداد الزيارات GoatCounter ---------- */
function track(path, title){
  const go = () => window.goatcounter && window.goatcounter.count && window.goatcounter.count({ path, title });
  if (window.goatcounter && window.goatcounter.count) go();
  else addEventListener('load', go, { once: true });
}

/* ---------- التنقل بين الواجهتين ---------- */
async function route(){
  await loadData();
  const p = location.hash.replace(/^#\/?/, '').split('/');
  if (p[0] === 'series' && p[1]) {
    const name = decodeURIComponent(p[1]);
    const n = parseInt(p[2], 10);
    seriesPage(name, isNaN(n) ? null : n);
    track('/series/' + name, name);
  } else {
    homePage();
    track('/', 'الرئيسية');
  }
  window.scrollTo(0, 0);
}

qInput.addEventListener('input', () => {
  curQuery = qInput.value;
  if (!document.getElementById('grid')) { location.hash = '#/'; return; }
  renderGrid();
});
addEventListener('hashchange', route);
route();
</script>
<script data-goatcounter="https://shortflix.goatcounter.com/count" data-goatcounter-settings='{"no_onload":true}' async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
