<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المسلسلات القصيرة</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #1e293b; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.5rem; color: #38bdf8; }
        
        .main-container { display: grid; grid-template-columns: 1fr 320px; gap: 1.5rem; padding: 1.5rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        @media (max-width: 900px) { .main-container { grid-template-columns: 1fr; } }
        
        .player-section { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; }
        video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; }
        .video-title { font-size: 1.25rem; font-weight: bold; margin-top: 1rem; color: #f1f5f9; }
        
        .playlist-section { background: #1e293b; border-radius: 12px; padding: 1rem; border: 1px solid #334155; max-height: 600px; overflow-y: auto; }
        .playlist-section h3 { margin-bottom: 1rem; color: #94a3b8; font-size: 1rem; }
        
        .episode-card { display: flex; gap: 0.75rem; padding: 0.75rem; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 0.5rem; background: #0f172a; }
        .episode-card:hover, .episode-card.active { background: #334155; }
        .episode-card img { width: 100px; height: 60px; object-fit: cover; border-radius: 4px; }
        .episode-info { display: flex; flex-direction: column; justify-content: center; }
        .episode-title { font-size: 0.9rem; font-weight: 600; color: #e2e8f0; }
        .series-name { font-size: 0.75rem; color: #38bdf8; margin-top: 0.25rem; }
    </style>
</head>
<body>

    <header>
        <h1>دراما قصيرة</h1>
        <a href="admin.html" style="color: #94a3b8; text-decoration: none; font-size: 0.9rem;">لوحة التحكم</a>
    </header>

    <div class="main-container">
        <div class="player-section">
            <video id="mainPlayer" controls poster="https://via.placeholder.com/800x450?text=%D8%A7%D8%AE%D8%AA%D8%B1+%D8%AD%D9%84%D9%82%D8%A9">
                <source id="videoSource" src="" type="video/mp4">
                متصفحك لا يدعم مشغل الفيديو.
            </video>
            <div class="video-title" id="currentVideoTitle">اختر حلقة للمشاهدة</div>
        </div>

        <div class="playlist-section">
            <h3>قائمة الحلقات والمسلسلات</h3>
            <div id="playlistContainer">
                <p style="color: #64748b; text-align: center;">جاري تحميل المحتوى...</p>
            </div>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        async function loadEpisodes() {
            const container = document.getElementById('playlistContainer');
            
            const { data: episodes, error } = await supabaseClient
                .from('episodes')
                .select('*')
                .order('created_at', { ascending: false });

            if (error || !episodes || episodes.length === 0) {
                container.innerHTML = '<p style="color: #64748b; text-align: center;">لا توجد حلقات معروضة حالياً.</p>';
                return;
            }

            container.innerHTML = '';
            episodes.forEach((ep, index) => {
                const card = document.createElement('div');
                card.className = `episode-card ${index === 0 ? 'active' : ''}`;
                card.innerHTML = `
                    <img src="${ep.thumbnail_url || 'https://via.placeholder.com/100x60'}" alt="${ep.title}">
                    <div class="episode-info">
                        <div class="episode-title">${ep.title}</div>
                        <div class="series-name">${ep.series_name}</div>
                    </div>
                `;
                card.onclick = () => playVideo(ep.video_url, ep.title, card);
                container.appendChild(card);
            });

            if(episodes.length > 0) {
                playVideo(episodes[0].video_url, episodes[0].title, container.children[0]);
            }
        }

        function playVideo(url, title, cardElement) {
            const player = document.getElementById('mainPlayer');
            const source = document.getElementById('videoSource');
            const titleElem = document.getElementById('currentVideoTitle');

            document.querySelectorAll('.episode-card').forEach(c => c.classList.remove('active'));
            if(cardElement) cardElement.classList.add('active');

            source.src = url;
            titleElem.textContent = title;
            player.load();
            player.play().catch(() => {});
        }

        window.onload = loadEpisodes;
    </script>
</body>
</html>
