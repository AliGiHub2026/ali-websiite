<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - إضافة حلقة جديدة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',system-ui,sans-serif}
body{background:#141414;color:#fff;padding:2rem 1rem;display:flex;justify-content:center}
.form-card{background:#1f1f1f;padding:2rem;border-radius:8px;width:100%;max-width:520px}
h2{margin-bottom:1.5rem;color:#e50914;text-align:center;font-weight:800}
.input-group{margin-bottom:1.1rem}
label{display:block;margin-bottom:.4rem;font-size:.9rem;color:#b3b3b3}
input{width:100%;padding:.75rem;border-radius:4px;border:1px solid #444;background:#333;color:#fff}
input:focus{outline:2px solid #fff}
button{width:100%;padding:.8rem;background:#e50914;color:#fff;border:none;border-radius:4px;font-weight:700;font-size:1rem;cursor:pointer}
button:hover{background:#b20710}
button:disabled{opacity:.6}
.status{margin-top:1rem;text-align:center;font-size:.9rem}
.hidden{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;color:#b3b3b3;font-size:.85rem}
.top button{width:auto;padding:.35rem .9rem;background:#333;font-size:.85rem}
.top button:hover{background:#444}
.home{display:block;text-align:center;margin-top:1.2rem;color:#b3b3b3;text-decoration:none;font-size:.9rem}
</style>
</head>
<body>
<div class="form-card" id="loginCard">
  <h2>تسجيل الدخول</h2>
  <form id="loginForm">
    <div class="input-group"><label>البريد الإلكتروني:</label><input type="email" id="email" autocomplete="username" required></div>
    <div class="input-group"><label>كلمة السر:</label><input type="password" id="password" autocomplete="current-password" required></div>
    <button type="submit" id="loginBtn">دخول</button>
  </form>
  <div id="loginStatus" class="status"></div>
  <a class="home" href="index.html">← العودة إلى الموقع</a>
</div>

<div class="form-card hidden" id="panelCard">
  <div class="top"><span id="who"></span><button type="button" id="logoutBtn">تسجيل الخروج</button></div>
  <h2>إضافة حلقة / مسلسل جديد</h2>
  <form id="addEpisodeForm">
    <div class="input-group">
      <label>اسم المسلسل (اكتب نفس الاسم لإضافة حلقة لمسلسل موجود):</label>
      <input type="text" id="seriesName" list="seriesList" placeholder="مثال: طردوها من العائلة" required>
      <datalist id="seriesList"></datalist>
    </div>
    <div class="input-group">
      <label>عنوان الحلقة:</label>
      <input type="text" id="epTitle" placeholder="مثال: الحلقة 1" required>
    </div>
    <div class="input-group">
      <label>رابط الفيديو (ملف master.m3u8 للجودات التلقائية، أو MP4):</label>
      <input type="url" id="videoUrl" placeholder="https://.../ep1/master.m3u8" required>
    </div>
    <div class="input-group">
      <label>رابط الصورة المصغرة (Thumbnail):</label>
      <input type="url" id="thumbUrl" placeholder="https://domain.com/image.jpg">
    </div>
    <button type="submit" id="submitBtn">حفظ ونشر الحلقة</button>
  </form>
  <div id="statusMessage" class="status"></div>
  <a class="home" href="index.html">← العودة إلى الموقع</a>
</div>

<script src="config.js"></script>
<script>
const loginCard = document.getElementById('loginCard');
const panelCard = document.getElementById('panelCard');

function showUI(session){
  loginCard.classList.toggle('hidden', !!session);
  panelCard.classList.toggle('hidden', !session);
  if (session) {
    document.getElementById('who').textContent = session.user.email;
    loadSeriesNames();
  }
}

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const st = document.getElementById('loginStatus');
  btn.disabled = true; st.style.color = '#b3b3b3'; st.textContent = 'جاري التحقق...';
  const { error } = await supabaseClient.auth.signInWithPassword({
    email: document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  });
  btn.disabled = false;
  if (error) { st.style.color = '#ff5a5f'; st.textContent = 'البريد أو كلمة السر غير صحيحة'; }
  else { st.textContent = ''; document.getElementById('password').value = ''; }
};

document.getElementById('logoutBtn').onclick = () => supabaseClient.auth.signOut();
supabaseClient.auth.onAuthStateChange((_event, session) => showUI(session));
supabaseClient.auth.getSession().then(({ data }) => showUI(data.session));

async function loadSeriesNames(){
  const { data } = await supabaseClient.from('episodes').select('series_name');
  const names = [...new Set((data || []).map(r => r.series_name).filter(Boolean))];
  document.getElementById('seriesList').innerHTML = names.map(n => {
    const o = document.createElement('option'); o.value = n; return o.outerHTML;
  }).join('');
}
document.getElementById('addEpisodeForm').onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('statusMessage');
  btn.disabled = true;
  status.style.color = '#b3b3b3';
  status.textContent = 'جاري الحفظ...';

  const series_name = document.getElementById('seriesName').value.trim();
  const title = document.getElementById('epTitle').value.trim();
  const video_url = document.getElementById('videoUrl').value;
  const thumbnail_url = document.getElementById('thumbUrl').value;

  try {
    const { error } = await supabaseClient.from('episodes').insert([{ series_name, title, video_url, thumbnail_url }]);
    if (error) throw error;
    status.style.color = '#46d369';
    status.textContent = 'تم إدراج الحلقة بنجاح!';
    document.getElementById('addEpisodeForm').reset();
    loadSeriesNames();
  } catch (error) {
    console.error('Supabase error:', error);
    status.style.color = '#ff5a5f';
    status.textContent = 'حدث خطأ أثناء الحفظ: ' + (error.message || error);
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
